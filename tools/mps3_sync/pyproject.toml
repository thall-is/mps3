[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mps3-sync"
version = "2.0.0"
description = "Cross-platform Podcast Sync & Push Client for the MPS3 Hi-Res Audio Player (ESP32-S3)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "MPS3 Audio Project" }
]
dependencies = [
    "requests>=2.28.0",
    "zeroconf>=0.131.0",
    "platformdirs>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=6.0.0",
]
youtube = [
    "yt-dlp>=2024.1.0",
]

[project.scripts]
mps3-sync = "mps3_sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mps3_sync*"]
