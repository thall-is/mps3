; ============================================================================
;  mps3 - Player de Audio Hi-Res para ESP32-S3 N16R8
;  PCM5102A (I2S Master) + MicroSD (SDMMC 4-Bit) + OLED SSD1306 + Joystick 5-way
; ============================================================================

[env:esp32-s3-n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = espidf

; --- N16R8: 16MB flash (Quad SPI) + 8MB PSRAM (Octal SPI) ---
board_build.flash_size  = 16MB
board_upload.flash_size = 16MB

board_build.partitions = partitions.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; A decodificacao FLAC/MP3 e' bem mais pesada que o resto do firmware.
; +240MHz da uma margem confortavel.
board_build.f_cpu = 240000000L
    

build_flags =
    -D ESP_ES_PARSER_SEARCH_LIMIT=16777216
    -DCFG_TUD_AUDIO=1
    -DCFG_TUD_AUDIO_ENABLE_EP_OUT=1
    -DCFG_TUD_AUDIO_FUNC_1_EP_OUT_SZ_MAX=192
    -DCFG_TUD_AUDIO_FUNC_1_EP_OUT_SW_BUF_SZ=384

; -fuse-cxa-atexit e' valida so' pra C++, mas em alguns setups do
; PlatformIO+ESP-IDF ela vaza pra compilacao dos arquivos .c. Isolar o C++
; (audio_player) no proprio componente ja deveria evitar isso, mas
; deixamos aqui como rede de seguranca.
build_unflags =
    -fuse-cxa-atexit

